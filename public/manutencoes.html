<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenções - CarroIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            opacity: 0;
            transition: opacity 0.5s;
        }

        body.page-loaded {
            opacity: 1;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow: 0 0 5px rgba(14, 165, 233, 0.3);
            }

            50% {
                box-shadow: 0 0 20px rgba(14, 165, 233, 0.6);
            }
        }

        @keyframes wiggle {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-3deg);
            }

            75% {
                transform: rotate(3deg);
            }
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-fade-up {
            animation: fadeInUp 0.6s ease forwards;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;
        }

        .animate-glow {
            animation: glow 2s ease-in-out infinite;
        }

        .animate-pop {
            animation: pop 0.3s ease;
        }

        .nav-link {
            transition: all 0.3s;
        }

        .nav-link:hover {
            background: rgba(14, 165, 233, 0.1);
            transform: translateX(5px);
        }

        .nav-link.active {
            background: linear-gradient(90deg, rgba(14, 165, 233, 0.2) 0%, transparent 100%);
            border-left: 3px solid #0ea5e9;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.5);
        }

        .maintenance-row {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.7) 100%);
            border: 1px solid rgba(148, 163, 184, 0.1);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .maintenance-row:hover {
            transform: translateX(10px) scale(1.01);
            border-color: rgba(14, 165, 233, 0.5);
            box-shadow: -5px 0 20px rgba(14, 165, 233, 0.2);
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 50;
            align-items: flex-start;
            justify-content: center;
            padding: 16px;
            overflow-y: auto;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            transform: scale(0.8) translateY(50px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal.active .modal-content {
            transform: scale(1) translateY(0);
        }

        .input-field {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.2);
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 15px rgba(14, 165, 233, 0.2);
            transform: scale(1.02);
        }

        .tipo-btn {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .tipo-btn:hover {
            transform: scale(1.1);
        }

        .tipo-btn.selected {
            border-color: #0ea5e9;
            background: rgba(14, 165, 233, 0.2);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
            animation: wiggle 0.5s ease;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 12px;
            color: white;
            z-index: 100;
            transform: translateY(100px) scale(0.8);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .toast.success {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
        }

        .toast.error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
        }

        .icon-badge {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.3s;
        }

        .maintenance-row:hover .icon-badge {
            transform: scale(1.2) rotate(10deg);
        }

        .sidebar {
            transition: transform 0.3s ease-out;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 35;
        }

        .sidebar-overlay.open {
            display: block;
        }

        .delete-btn {
            transition: all 0.3s;
        }

        .delete-btn:hover {
            transform: scale(1.3) rotate(15deg);
            color: #ef4444;
        }
    </style>
</head>

<body class="text-gray-100">
    <header class="md:hidden fixed top-0 left-0 right-0 glass-card z-30 px-4 py-3 flex items-center justify-between">
        <button onclick="toggleSidebar()" class="p-2"><svg class="w-6 h-6" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg></button>
        <span class="font-bold"><span class="animate-float inline-block">🚗</span> CarroIA</span>
        <button onclick="openModal()" class="p-2 text-sky-400 animate-pulse">➕</button>
    </header>
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <aside id="sidebar" class="sidebar fixed left-0 top-0 h-full w-52 glass-card z-40 flex flex-col">
        <div class="p-4 border-b border-slate-700/50">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-xl bg-gradient-to-br from-sky-500 to-sky-700 flex items-center justify-center animate-glow">
                    <span class="text-xl animate-float">🚗</span>
                </div>
                <div>
                    <h1 class="text-lg font-bold">CarroIA</h1>
                    <p class="text-xs text-slate-400">Gestão de Manutenção</p>
                </div>
            </div>
        </div>
        <nav class="flex-1 p-3 space-y-0.5">
            <a href="index.html" class="nav-link flex items-center gap-2 px-3 py-2 rounded-lg text-slate-300 text-sm">📊
                Dashboard</a>
            <a href="veiculos.html"
                class="nav-link flex items-center gap-2 px-3 py-2 rounded-lg text-slate-300 text-sm">🚙 Veículos</a>
            <a href="manutencoes.html"
                class="nav-link active flex items-center gap-2 px-3 py-2 rounded-lg text-slate-300 text-sm">🔧
                Manutenções</a>
        </nav>
    </aside>
    <main class="md:ml-52 p-4 md:p-8 pt-20 md:pt-8">
        <header class="mb-6 flex flex-col gap-3 animate-fade-up">
            <div>
                <h2 class="text-2xl md:text-3xl font-bold mb-1">Manutenções</h2>
                <p class="text-slate-400 text-sm">Histórico de serviços</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-3">
                <select id="filtro-veiculo"
                    class="input-field px-3 py-2 rounded-xl text-white outline-none text-sm flex-1">
                    <option value="">Todos os veículos</option>
                </select>
                <button onclick="openModal()"
                    class="hidden md:flex btn-primary px-6 py-2 rounded-xl text-white font-medium items-center gap-2 text-sm"><span
                        class="animate-pulse">➕</span> Nova Manutenção</button>
            </div>
        </header>
        <div class="space-y-3" id="manutencoes-lista">
            <div class="text-center py-12 text-slate-500 animate-fade-up"><span
                    class="text-5xl block mb-3 animate-float">🔧</span>
                <p>Nenhuma manutenção registrada</p>
            </div>
        </div>
    </main>
    <div id="modal-manutencao" class="modal">
        <div class="modal-content glass-card rounded-2xl p-5 w-full max-w-lg my-4">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 id="modal-titulo" class="text-lg font-bold">Nova Manutenção</h3>
                    <p id="modal-subtitulo" class="text-xs text-slate-400">Registre os detalhes do serviço realizado</p>
                </div>
                <button onclick="closeModal()" class="text-2xl hover:rotate-90 transition-transform">&times;</button>
            </div>
            <input type="hidden" id="edit-id" value="">
            <form id="form-manutencao" class="space-y-4">
                <div><label class="block text-xs text-slate-300 mb-1">Veículo *</label><select name="veiculo_id"
                        id="select-veiculo" required
                        class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm">
                        <option value="">Selecione</option>
                    </select></div>
                <div><label class="block text-xs text-slate-300 mb-2">Tipo *</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button type="button"
                            class="tipo-btn flex flex-col items-center gap-1 p-2 rounded-xl border border-slate-600 text-slate-300 text-xs"
                            data-tipo="Troca de Óleo">🛢️<span>Óleo</span></button>
                        <button type="button"
                            class="tipo-btn flex flex-col items-center gap-1 p-2 rounded-xl border border-slate-600 text-slate-300 text-xs"
                            data-tipo="Revisão">🔍<span>Revisão</span></button>
                        <button type="button"
                            class="tipo-btn flex flex-col items-center gap-1 p-2 rounded-xl border border-slate-600 text-slate-300 text-xs"
                            data-tipo="Pneus">🛞<span>Pneus</span></button>
                        <button type="button"
                            class="tipo-btn flex flex-col items-center gap-1 p-2 rounded-xl border border-slate-600 text-slate-300 text-xs"
                            data-tipo="Freios">🛑<span>Freios</span></button>
                        <button type="button"
                            class="tipo-btn flex flex-col items-center gap-1 p-2 rounded-xl border border-slate-600 text-slate-300 text-xs"
                            data-tipo="Filtros">🌀<span>Filtros</span></button>
                        <button type="button"
                            class="tipo-btn flex flex-col items-center gap-1 p-2 rounded-xl border border-slate-600 text-slate-300 text-xs"
                            data-tipo="Bateria">🔋<span>Bateria</span></button>
                        <button type="button"
                            class="tipo-btn flex flex-col items-center gap-1 p-2 rounded-xl border border-slate-600 text-slate-300 text-xs"
                            data-tipo="Suspensão">🔩<span>Suspensão</span></button>
                        <button type="button"
                            class="tipo-btn flex flex-col items-center gap-1 p-2 rounded-xl border border-slate-600 text-slate-300 text-xs"
                            data-tipo="Outro">⚙️<span>Outro</span></button>
                    </div>
                    <input type="hidden" name="tipo" id="input-tipo" required>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs text-slate-300 mb-1">Título *</label><input type="text"
                            name="titulo" required placeholder="Ex: Troca de óleo 5W30"
                            class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Subtítulo</label><input type="text"
                            name="subtitulo" placeholder="Ex: Motor 1.0"
                            class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm"></div>
                </div>
                <div><label class="block text-xs text-slate-300 mb-1">Descrição</label><textarea name="descricao"
                        rows="2" placeholder="Detalhes adicionais sobre o serviço..."
                        class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm resize-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs text-slate-300 mb-1">Data *</label><input type="date" name="data"
                            required class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm">
                    </div>
                    <div><label class="block text-xs text-slate-300 mb-1">KM Atual</label><input type="text"
                            inputmode="numeric" pattern="[0-9]*" name="km" placeholder="Ex: 104092"
                            class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm"></div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-xs text-slate-300 mb-1">Custo (R$)</label><input type="text"
                            inputmode="decimal" name="custo" placeholder="Ex: 150,00"
                            class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm"></div>
                    <div><label class="block text-xs text-slate-300 mb-1">Local</label><input type="text" name="local"
                            class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm"></div>
                </div>
                <div><label class="block text-xs text-slate-300 mb-1">Marca do Produto/Peça</label><input type="text"
                        name="marca_peca" placeholder="Ex: Castrol, Pirelli, Bosch, NGK"
                        class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm"></div>
                <div class="border-t border-slate-700/50 pt-4 mt-2">
                    <p class="text-xs text-sky-400 mb-3 font-medium">📅 Próxima Manutenção (opcional)</p>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-xs text-slate-300 mb-1">Próximo KM</label><input type="text"
                                inputmode="numeric" pattern="[0-9]*" name="proximo_km" placeholder="Ex: 114092"
                                class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm"></div>
                        <div><label class="block text-xs text-slate-300 mb-1">Próxima Data</label><input type="date"
                                name="proxima_data"
                                class="input-field w-full px-3 py-2 rounded-xl text-white outline-none text-sm"></div>
                    </div>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeModal()"
                        class="flex-1 py-2 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-700/50 transition-all text-sm">Cancelar</button>
                    <button type="submit"
                        class="flex-1 btn-primary py-2 rounded-xl text-white font-medium text-sm">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
    <script>
        let tipoSelecionado = '';

        // Converte data do PostgreSQL para formato do input (YYYY-MM-DD)
        function formatDateForInput(dateValue) {
            if (!dateValue) return '';
            // Se já está no formato correto
            if (typeof dateValue === 'string' && dateValue.match(/^\d{4}-\d{2}-\d{2}$/)) {
                return dateValue;
            }
            // Se é uma data ISO com timezone
            if (typeof dateValue === 'string' && dateValue.includes('T')) {
                return dateValue.split('T')[0];
            }
            // Tenta converter de Date object
            try {
                const date = new Date(dateValue);
                if (!isNaN(date.getTime())) {
                    return date.toISOString().split('T')[0];
                }
            } catch (e) { }
            return '';
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebar-overlay').classList.toggle('open'); }
        document.addEventListener('DOMContentLoaded', async () => {
            document.body.classList.add('page-loaded');
            document.querySelector('input[name="data"]').valueAsDate = new Date();
            await loadVeiculos(); await loadManutencoes();
            document.getElementById('filtro-veiculo').addEventListener('change', loadManutencoes);
            const params = new URLSearchParams(window.location.search);
            if (params.get('veiculo')) { document.getElementById('filtro-veiculo').value = params.get('veiculo'); loadManutencoes(); }
            if (window.location.hash === '#nova') openModal();
            document.querySelectorAll('.tipo-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected'); tipoSelecionado = btn.dataset.tipo; document.getElementById('input-tipo').value = tipoSelecionado;
                });
            });
        });
        async function loadVeiculos() {
            const veiculos = await (await fetch('/api/veiculos')).json();
            const s1 = document.getElementById('select-veiculo'), s2 = document.getElementById('filtro-veiculo');
            veiculos.forEach(v => { s1.add(new Option(`${v.marca} ${v.modelo}`, v.id)); s2.add(new Option(`${v.marca} ${v.modelo}`, v.id)); });
        }
        async function loadManutencoes() {
            const vid = document.getElementById('filtro-veiculo').value;
            const url = vid ? `/api/manutencoes?veiculo_id=${vid}` : '/api/manutencoes';
            const manutencoes = await (await fetch(url)).json();
            const lista = document.getElementById('manutencoes-lista');
            if (!manutencoes.length) { lista.innerHTML = '<div class="text-center py-12 text-slate-500 animate-fade-up"><span class="text-5xl block mb-3 animate-float">🔧</span><p>Nenhuma manutenção</p></div>'; return; }
            lista.innerHTML = manutencoes.map((m, i) => {
                let proximaInfo = '';
                if (m.proximo_km || m.proxima_data) {
                    const partes = [];
                    if (m.proximo_km) partes.push(`${m.proximo_km.toLocaleString('pt-BR')} km`);
                    if (m.proxima_data) partes.push(formatDate(m.proxima_data));
                    proximaInfo = `<p class="text-[10px] text-amber-400 mt-0.5">📅 Próx: ${partes.join(' ou ')}</p>`;
                }
                return `
        <div class="maintenance-row rounded-xl p-3 md:p-4 flex items-center gap-3 animate-fade-up" style="animation-delay: ${i * 0.08}s; opacity: 0;">
          <div class="icon-badge ${getTipoColor(m.tipo)}">${getTipoIcon(m.tipo)}</div>
          <div class="flex-1 min-w-0">
            <div class="flex flex-col gap-0.5 mb-0.5">
              <div class="flex items-center gap-2 flex-wrap">
                <h4 class="font-semibold text-sm">${m.tipo}</h4>
              </div>
              <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-sky-500/20 text-sky-400 w-fit max-w-[120px] truncate" title="${m.marca} ${m.modelo}">${m.marca} ${m.modelo}</span>
            </div>
            <p class="text-xs text-white font-medium">${m.titulo || m.tipo}${m.subtitulo ? ` - ${m.subtitulo}` : ''}</p>
            <p class="text-xs text-slate-400 truncate">${m.descricao || 'Sem descrição'}${m.km ? ` • ${m.km.toLocaleString('pt-BR')} km` : ''}</p>
            ${proximaInfo}
          </div>
          <div class="text-right flex-shrink-0">
            <p class="font-bold text-sm">${formatCurrency(m.custo)}</p>
            <p class="text-[10px] text-slate-500">${formatDate(m.data)}</p>
          </div>
          <div class="flex gap-1">
            <button onclick='editManutencao(${JSON.stringify(m).replace(/'/g, "&#39;")})' class="edit-btn text-slate-500 p-1 hover:text-sky-400 transition-all" title="Editar">✏️</button>
            <button onclick="deleteManutencao(${m.id})" class="delete-btn text-slate-500 p-1" title="Excluir">🗑️</button>
          </div>
        </div>`;
            }).join('');
        }
        function openModal(isEdit = false) {
            document.getElementById('modal-titulo').textContent = isEdit ? 'Editar Manutenção' : 'Nova Manutenção';
            document.getElementById('modal-subtitulo').textContent = isEdit ? 'Atualize os detalhes do serviço' : 'Registre os detalhes do serviço realizado';
            document.getElementById('modal-manutencao').classList.add('active');
        }
        function closeModal() {
            document.getElementById('modal-manutencao').classList.remove('active');
            document.getElementById('form-manutencao').reset();
            document.getElementById('edit-id').value = '';
            document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('selected'));
            tipoSelecionado = '';
            document.querySelector('input[name="data"]').valueAsDate = new Date();
        }
        function editManutencao(m) {
            document.getElementById('edit-id').value = m.id;
            document.querySelector('[name="veiculo_id"]').value = m.veiculo_id;
            document.querySelector('[name="titulo"]').value = m.titulo || '';
            document.querySelector('[name="subtitulo"]').value = m.subtitulo || '';
            document.querySelector('[name="marca_peca"]').value = m.marca_peca || '';
            document.querySelector('[name="descricao"]').value = m.descricao || '';
            // Formatar data para o input (precisa ser YYYY-MM-DD)
            document.querySelector('[name="data"]').value = formatDateForInput(m.data);
            document.querySelector('[name="km"]').value = m.km || '';
            document.querySelector('[name="custo"]').value = m.custo ? m.custo.toString().replace('.', ',') : '';
            document.querySelector('[name="local"]').value = m.local || '';
            document.querySelector('[name="proximo_km"]').value = m.proximo_km || '';
            document.querySelector('[name="proxima_data"]').value = formatDateForInput(m.proxima_data);
            // Selecionar tipo
            document.querySelectorAll('.tipo-btn').forEach(btn => {
                btn.classList.remove('selected');
                if (btn.dataset.tipo === m.tipo) {
                    btn.classList.add('selected');
                    tipoSelecionado = m.tipo;
                    document.getElementById('input-tipo').value = m.tipo;
                }
            });
            openModal(true);
        }
        document.getElementById('form-manutencao').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!tipoSelecionado) { showToast('Selecione um tipo!', 'error'); return; }
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            data.veiculo_id = parseInt(data.veiculo_id);

            const editId = document.getElementById('edit-id').value;
            const isEdit = editId !== '';
            const url = isEdit ? `/api/manutencoes/${editId}` : '/api/manutencoes';
            const method = isEdit ? 'PUT' : 'POST';

            const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
            if (res.ok) {
                showToast(isEdit ? 'Manutenção atualizada! ✅' : 'Manutenção registrada! 🔧', 'success');
                closeModal();
                loadManutencoes();
            } else showToast('Erro ao salvar', 'error');
        });
        async function deleteManutencao(id) { if (!confirm('Excluir esta manutenção?')) return; await fetch('/api/manutencoes/' + id, { method: 'DELETE' }); showToast('Manutenção excluída!', 'success'); loadManutencoes(); }
    </script>
</body>

</html>
